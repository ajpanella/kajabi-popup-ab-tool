name: Protein experiment monitor
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: protein-experiment-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/monitor-experiment.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save aggregate review only
        if: always()
        run: |
          git config user.name 'Protein Experiment Monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/high-protein-monitor.json experiments/round-history.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update protein experiment review'
          git pull --rebase origin main
          git push origin HEAD:main
